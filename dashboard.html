<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT Dashboard - REST API</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
body { background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; color: #333; }
.container { max-width: 1000px; margin: 0 auto; }
h1 { color: white; text-align: center; margin-bottom: 25px; font-size: 28px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; }
.card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; }
.card .label { font-size: 14px; color: #888; letter-spacing: 1px; }
.card .value { font-size: 42px; font-weight: bold; margin: 10px 0; color: #667eea; }
.card .unit { font-size: 18px; color: #aaa; }
.status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 14px; }
.status-online { background: #d4edda; color: #155724; }
.status-offline { background: #f8d7da; color: #721c24; }
.status-alert { background: #fff3cd; color: #856404; }
.panel { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 25px; }
.panel h2 { font-size: 18px; margin-bottom: 15px; color: #444; }
.controls { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
.btn { padding: 12px 30px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
.btn-on { background: #28a745; color: white; }
.btn-on:hover { background: #218838; }
.btn-off { background: #dc3545; color: white; }
.btn-off:hover { background: #c82333; }
.btn-set { background: #667eea; color: white; padding: 12px 20px; }
.btn-set:hover { background: #5568d3; }
input[type=number] { padding: 11px; border: 1px solid #ccc; border-radius: 10px; width: 100px; font-size: 15px; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
th { background: #f8f9fa; color: #666; font-size: 13px; }
tr:hover td { background: #f9f9f9; }
.chart-box { position: relative; height: 260px; }
#log { background: #1e1e1e; color: #0f0; font-family: monospace; padding: 15px; border-radius: 10px; max-height: 180px; overflow-y: auto; font-size: 13px; line-height: 1.6; }
#log .error { color: #f66; }
#log .info { color: #6af; }
</style>
</head>
<body>
<div class="container">
  <h1>IoT Dashboard — REST API</h1>

  <div class="cards">
    <div class="card"><div class="label">Suhu</div><div class="value" id="suhu">--</div><div class="unit">°C</div></div>
    <div class="card"><div class="label">Kelembaban</div><div class="value" id="kelembaban">--</div><div class="unit">%</div></div>
    <div class="card"><div class="label">Status Sensor</div>
      <div class="value" style="font-size:22px;"><span class="status-badge status-offline" id="status-badge">OFFLINE</span></div>
    </div>
  </div>

  <div class="panel">
    <h2>Kontrol Perangkat</h2>
    <div class="controls">
      <button class="btn btn-on" onclick="kontrol('lamp','on')">Nyalakan Lampu</button>
      <button class="btn btn-off" onclick="kontrol('lamp','off')">Matikan Lampu</button>
    </div>
  </div>

  <div class="panel">
    <h2>Batas Suhu</h2>
    <div class="controls">
      <input type="number" id="batas" step="0.5" value="35">
      <button class="btn btn-set" onclick="setBatas()">Simpan batas</button>
      <span id="batas-aktif" style="color:#666;">Batas aktif: -- °C</span>
    </div>
  </div>

  <div class="panel">
    <h2>Grafik Suhu dan Kelembaban</h2>
    <div class="chart-box"><canvas id="grafik"></canvas></div>
  </div>

  <div class="panel">
    <h2>10 Data Sensor Terakhir</h2>
    <table>
      <thead><tr><th>Waktu</th><th>Suhu (°C)</th><th>Kelembaban (%)</th></tr></thead>
      <tbody id="history-body"><tr><td colspan="3" style="text-align:center;color:#999;">Loading...</td></tr></tbody>
    </table>
  </div>

  <div class="panel">
    <h2>Log Aktivitas</h2>
    <div id="log"></div>
  </div>
</div>

<script>
// ================= KONFIGURASI =================
const HOST = 'localhost:1880';
const API_BASE = `http://${HOST}/api`;
const WS_URL = `ws://${HOST}/ws/sensor`;
const API_KEY = 'rahasia123';          // harus sama dengan API_KEY di flow Node-RED
const MAX_POINTS = 20;

function authHeaders(extra = {}) {
  return Object.assign({ 'X-API-Key': API_KEY }, extra);
}

function log(msg, type = 'info') {
  const el = document.getElementById('log');
  const time = new Date().toLocaleTimeString();
  el.innerHTML += `<div class="${type}">[${time}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

function setBadge(text, cls) {
  const b = document.getElementById('status-badge');
  b.textContent = text;
  b.className = 'status-badge ' + cls;
}

// ================= GRAFIK (Chart.js) =================
let grafik = null;
if (typeof Chart !== 'undefined') {
  grafik = new Chart(document.getElementById('grafik'), {
    type: 'line',
    data: { labels: [], datasets: [
      { label: 'Suhu (°C)', data: [], borderColor: '#dc3545', tension: 0.3 },
      { label: 'Kelembaban (%)', data: [], borderColor: '#667eea', tension: 0.3 }
    ]},
    options: { responsive: true, maintainAspectRatio: false, animation: false }
  });
} else {
  log('Chart.js tidak termuat (cek koneksi internet). Grafik tidak tampil.', 'error');
}

// ================= DATA LOKAL =================
let rows = [];            // data terbaru untuk tabel dan grafik
let lastAlert = false;
let lastMsgTime = 0;

function renderTable() {
  const tbody = document.getElementById('history-body');
  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#999;">Belum ada data</td></tr>';
    return;
  }
  tbody.innerHTML = rows.slice(-10).reverse().map(d => `
    <tr><td>${new Date(d.received).toLocaleTimeString()}</td><td>${d.suhu}</td><td>${d.kelembaban}</td></tr>`).join('');
}

function renderChart() {
  if (!grafik) return;
  const r = rows.slice(-MAX_POINTS);
  grafik.data.labels = r.map(d => new Date(d.received).toLocaleTimeString());
  grafik.data.datasets[0].data = r.map(d => d.suhu);
  grafik.data.datasets[1].data = r.map(d => d.kelembaban);
  grafik.update();
}

// dipanggil tiap ada data baru dari WebSocket
function handleData(d) {
  lastMsgTime = Date.now();
  document.getElementById('suhu').textContent = d.suhu;
  document.getElementById('kelembaban').textContent = d.kelembaban;

  if (d.alert) setBadge('SUHU TINGGI', 'status-alert');
  else setBadge('ONLINE', 'status-online');

  if (d.alert && !lastAlert) log(`⚠ Peringatan: suhu ${d.suhu} °C melewati batas`, 'error');
  if (!d.alert && lastAlert) log('Suhu kembali normal', 'info');
  lastAlert = !!d.alert;

  rows.push(d);
  if (rows.length > 50) rows.shift();
  renderTable();
  renderChart();
}

// ================= WEBSOCKET (tanpa polling) =================
function connectWS() {
  const ws = new WebSocket(WS_URL);
  ws.onopen = () => log('WebSocket terhubung, data masuk otomatis tanpa polling');
  ws.onmessage = (e) => {
    try { handleData(JSON.parse(e.data)); } catch (err) { /* abaikan pesan non-JSON */ }
  };
  ws.onclose = () => {
    setBadge('OFFLINE', 'status-offline');
    log('WebSocket terputus, mencoba lagi dalam 3 detik...', 'error');
    setTimeout(connectWS, 3000);
  };
  ws.onerror = () => ws.close();
}

// tandai OFFLINE kalau tidak ada data baru > 10 detik
setInterval(() => {
  if (lastMsgTime && Date.now() - lastMsgTime > 10000) setBadge('OFFLINE', 'status-offline');
}, 2000);

// ================= GET /api/history (dari SQLite), sekali saat load =================
async function loadHistory() {
  try {
    const res = await fetch(`${API_BASE}/history`, { headers: authHeaders() });
    const json = await res.json();
    if (res.status === 401) { log(`✗ ${json.message}`, 'error'); return; }
    rows = json.data || [];
    renderTable();
    renderChart();
    log(`History dimuat dari ${json.source || 'server'}: ${json.count} data`);
  } catch (err) {
    log(`Gagal memuat history: ${err.message}`, 'error');
  }
}

// ================= GET /api/threshold =================
async function loadBatas() {
  try {
    const res = await fetch(`${API_BASE}/threshold`, { headers: authHeaders() });
    const json = await res.json();
    if (json.status === 'success') {
      document.getElementById('batas-aktif').textContent = `Batas aktif: ${json.threshold} °C`;
      document.getElementById('batas').value = json.threshold;
    }
  } catch (err) {
    log(`Gagal memuat batas: ${err.message}`, 'error');
  }
}

// ================= POST /api/kontrol =================
async function kontrol(device, action) {
  try {
    const res = await fetch(`${API_BASE}/kontrol`, {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ device, action })
    });
    const json = await res.json();
    if (json.status === 'success') log(`✓ Perintah terkirim: ${device} → ${action}`, 'info');
    else log(`✗ Gagal: ${json.message}`, 'error');
  } catch (err) {
    log(`✗ Error kontrol: ${err.message}`, 'error');
  }
}

// ================= PUT /api/threshold =================
async function setBatas() {
  const nilai = parseFloat(document.getElementById('batas').value);
  try {
    const res = await fetch(`${API_BASE}/threshold`, {
      method: 'PUT',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ batas: nilai })
    });
    const json = await res.json();
    if (json.status === 'success') {
      log(`✓ Batas suhu diubah menjadi ${json.threshold} °C`, 'info');
      document.getElementById('batas-aktif').textContent = `Batas aktif: ${json.threshold} °C`;
    } else {
      log(`✗ Gagal: ${json.message}`, 'error');
    }
  } catch (err) {
    log(`✗ Error set batas: ${err.message}`, 'error');
  }
}

log('Dashboard dimulai.');
loadHistory();
loadBatas();
connectWS();
</script>
</body>
</html>
